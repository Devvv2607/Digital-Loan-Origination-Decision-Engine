# Local development database only. The password below is a local-only
# placeholder, not a secret; production uses Neon with its own credentials.
name: lendwise

services:
  db:
    image: postgres:16-alpine
    container_name: lendwise-db
    environment:
      POSTGRES_USER: lendwise
      POSTGRES_PASSWORD: lendwise_local_only
      POSTGRES_DB: lendwise
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lendwise -d lendwise"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
